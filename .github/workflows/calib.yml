name: IMU kalibrasyonu

on:
  push:
    branches: [main]
    paths:
      - "tools/imu_calibrate.py"
      - "tools/insv_imu.py"
      - ".github/workflows/calib.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  INSV_ID: 1R4PdzliQXXfffxXTTiXfYU3nw-Lb81kh

jobs:
  calib:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q opencv-python-headless numpy
      - name: Klip
        run: |
          mkdir -p media out
          curl -sSL --retry 3 -o media/clip.insv "https://drive.usercontent.google.com/download?id=$INSV_ID&export=download&confirm=t"
      - name: Ölç
        run: python3 tools/imu_calibrate.py media/clip.insv out/calib.json 2>&1 | tee out/calib.log
      - name: Sonucu calib dalına yaz
        if: always()
        run: |
          mkdir -p out && cd out
          echo "commit=${GITHUB_SHA}" > STATUS.txt
          git init -q -b calib
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "calib ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" calib
