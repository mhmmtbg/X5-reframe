name: Sabitleme analizi

on:
  push:
    branches: [main]
    paths:
      - "tools/stab_eval.py"
      - ".github/workflows/stab.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        clip:
          - { name: clip1, id: 1R4PdzliQXXfffxXTTiXfYU3nw-Lb81kh }
          - { name: clip2, id: 1T0mubdRJ-fYz90XzSIdoQPWGQHcjf2K0 }
    steps:
      - uses: actions/checkout@v4
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q opencv-python-headless numpy scipy
      - name: Klip
        run: |
          mkdir -p media
          curl -sSL --retry 3 -o media/clip.insv "https://drive.usercontent.google.com/download?id=${{ matrix.clip.id }}&export=download&confirm=t"
          ls -la media
      - name: Ölç
        run: |
          mkdir -p out
          python3 tools/stab_eval.py media/clip.insv out 2>&1 | tee out/log.txt
      - name: Sonucu yaz
        if: always()
        run: |
          cd out
          echo "commit=${GITHUB_SHA}" > STATUS.txt
          git init -q -b stab
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "stab ${{ matrix.clip.name }} ${GITHUB_SHA::7}"
          for i in 1 2 3; do git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:stab-${{ matrix.clip.name }} && break; sleep 5; done
