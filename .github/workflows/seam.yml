name: Dikiş analizi

on:
  push:
    branches: [main]
    paths:
      - "tools/seam_analyze.py"
      - ".github/workflows/seam.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seam:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        clip:
          - { name: clip1, id: 1R4PdzliQXXfffxXTTiXfYU3nw-Lb81kh }
          - { name: clip2, id: 1T0mubdRJ-fYz90XzSIdoQPWGQHcjf2K0 }
    steps:
      - uses: actions/checkout@v4
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q opencv-python-headless numpy pillow
      - name: Klip
        run: |
          mkdir -p media
          curl -sSL --retry 3 -o media/clip.insv "https://drive.usercontent.google.com/download?id=${{ matrix.clip.id }}&export=download&confirm=t"
          ls -la media
      - name: Ölç
        run: |
          mkdir -p out/${{ matrix.clip.name }}
          python3 tools/seam_analyze.py media/clip.insv out/${{ matrix.clip.name }} 2>&1 | tee out/${{ matrix.clip.name }}/log.txt
      - name: Sonucu seam dalına yaz
        if: always()
        run: |
          cd out
          echo "commit=${GITHUB_SHA}" > ${{ matrix.clip.name }}/STATUS.txt
          git init -q -b seam
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin seam && git checkout -q -b tmp FETCH_HEAD -- . 2>/dev/null || true
          git add -A
          git commit -qm "seam ${{ matrix.clip.name }} ${GITHUB_SHA::7}"
          for i in 1 2 3; do git push -f origin HEAD:seam-${{ matrix.clip.name }} && break; sleep 5; done
